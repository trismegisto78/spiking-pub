# Spicy seasons: living costs a bit more all year, noticeably more in winter.
# Crop varieties as in terrain_50_crops.
# The agents get one extra "act" output neuron. Acting on hidden fertile soil plants a crop
# (ripe after grow_time, worth 3 food items); acting on barren soil poisons the cell.
experiment: terrain_50_spicy
seed: 42
world:
  width: 50
  height: 50
  steps_per_episode: 1000
agent:
  metabolic_cost: 0.08      # cost of living per step, all year (default 0.05)
stimuli:
  - type: season              # list it first: it updates the other stimuli each step
    random_phase: true        # each life starts at a random time of the year
    channels: [phase_sin, phase_cos]   # the agents feel the time of year
    seasons:
      - { name: spring, length: 125, modifiers: { food.regrow_rate: 2.0, terrain.growth_rate: 1.5 } }
      - { name: summer, length: 125, living_cost: 0.05, modifiers: { hazard.damage: 2.0 } }
      - { name: autumn, length: 125, modifiers: { terrain.harvest_energy: 1.5 } }
      - { name: winter, length: 125, living_cost: 0.15,   # winter total: 0.23 per step
          modifiers: { food.regrow_rate: 0.0, terrain.growth_rate: 0.2, hazard.damage: 0.5, terrain.action_cost: 2.0 } }
  - type: food
    count: 95
    regrow_rate: 0.01
  - type: hazard
    count: 8
    radius: 2.5
    damage: [1.0, 3.0, 6.0]   # each zone gets one level; sensed in proportion
  - type: terrain
    action: 0
    fertile_zones: 20         # ~48% of the grid is fertile (invisible to the agents)
    fertile_radius: 5.0
    crops:                    # weight = how often a zone grows that variety
      - { name: slow,    grow_time: 30, energy: 15.0, weight: 3 }
      - { name: medium,  grow_time: 15, energy: 7.0,  weight: 3 }
      - { name: fast,    grow_time: 5,  energy: 2.0,  weight: 3 }
      - { name: jackpot, grow_time: 5,  energy: 60.0, weight: 0.5 }   # rare exception
    poison_damage: 2.0
    poison_duration: 200
    action_cost: 0.05
network:
  encoder: rate
  hidden_max: 30
  dt_ms: 1.0
  action_outputs: 1
  action_threshold_hz: 50.0
  neuron: { tau_m: 20.0, v_thresh: 1.0, v_reset: 0.0, refractory_ms: 2.0 }
genetics:
  population: 200
  generations: 300
  tournament_size: 3
  elitism: 5
  mutation: { weight: 0.1, threshold: 0.05, add_synapse: 0.02, remove_synapse: 0.01 }
fitness:
  energy: 1.0
  firing_penalty: { target_rate_hz: 20, weight: 0.5 }
  silence_penalty: { weight: 0.5 }
  exploration: { weight: 0.0 }
