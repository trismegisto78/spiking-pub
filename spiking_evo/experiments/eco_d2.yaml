# Stage D2: as eco_d1, plus brain growth that costs energy, kin senses and a "feed" action.
# Juveniles are born with dormant neurons that wake as they invest energy in their brain;
# adults may give energy to their own juvenile offspring within reach. Nothing forces it.
experiment: eco_d2
seed: 1
world:
  width: 50
  height: 50
agent:
  initial_energy: 60.0
  metabolic_cost: 0.05
  move_cost: 0.02
stimuli:
  - type: body                # own energy and juvenile flag
  - type: food
    count: 120
    regrow_rate: 0.02
  - type: hazard
    count: 6
    radius: 2.5
    damage: [1.0, 3.0]
  - type: kin                 # own offspring / parent direction; "feed" action
    action: 0
    feed_amount: 2.0
    feed_efficiency: 0.8
    kin_only: true
network:
  encoder: rate
  hidden_max: 30
  hidden_init: 5
  action_outputs: 1           # the feed action
  development:
    enabled: true
    trigger: growth           # neurons wake by investing energy, not by suffering damage
    init_dormant_prob: 0.5
    init_wake_at: 10.0        # energy invested to wake a neuron (a gene, evolves)
    neuron_cost: 0.002
genetics:
  mutation: { weight: 0.1, threshold: 0.05, add_synapse: 0.02, remove_synapse: 0.01 }
ecosystem:
  capacity: 300
  # start from foragers evolved in food_hazard_50_d3 (random brains go extinct)
  init_from: spiking_evo/experiments/seed_populations/foragers.json.gz
  initial_population: 120
  ticks: 50000
  log_every: 250
  snapshot_every: 10000
  max_age: 3000
  juvenile_speed: 0.5
  juvenile_damage: 2.0
  init_repro_threshold: 100.0
  init_endowment: 0.5
  init_clutch: 2
  init_juvenile_age: 150.0
  growth_rate: 0.1            # energy per step invested in the brain while neurons sleep
  growth_reserve: 10.0
