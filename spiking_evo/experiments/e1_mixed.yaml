# Stage E1, unrelated individuals + signal ON. 400 genomes, groups of 10 re-drawn at
# random every episode, individual selection.
# Shared by the four E1 conditions (2x2: relatedness x channel): the E0 world (groups of 10,
# 40x40, 60 food items in 3 patches that relocate every 250 steps, food sensed within 2 cells,
# the others within 6), plus a `signal` channel: one generic action output; an agent whose
# action fires emits for that step (cost 0.01) and the group hears it at the next step within
# 6 cells, by sector. 400 agents per generation in every condition. Analysis and hypotheses:
# scripts/compare_e1.py (fixed before running).
experiment: e1_mixed
seed: 1
world:
  width: 40
  height: 40
  steps_per_episode: 1000
  arenas: groups
  group_size: 10
  group_shuffle: true
  same_start: false
stimuli:
  - type: food_patch
    count: 60
    patches: 3
    patch_radius: 1.5
    relocate_every: 250
    regrow_rate: 0.02
    sense_radius: 2
  - type: others
    sense_radius: 6
    sense_gain: 1.0
  - type: signal
    action: 0
    sense_radius: 6
    sense_gain: 1.0
    emit_cost: 0.01
network:
  encoder: rate
  hidden_max: 30
  action_outputs: 1
genetics:
  population: 400
  clones: 1
  generations: 300
  tournament_size: 3
  elitism: 5
  mutation: { weight: 0.1, threshold: 0.05, add_synapse: 0.02, remove_synapse: 0.01 }
fitness:
  energy: 1.0
  firing_penalty: { target_rate_hz: 20, weight: 0.5 }
  silence_penalty: { weight: 0.5 }
