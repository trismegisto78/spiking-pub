# Same evolutionary path as curriculum_50, with plasticity: synapses learn during life
# (reward-modulated STDP; learning rate and plastic synapses evolve).
# Evolutionary path: the environment gets harder over the generations and the population
# never restarts from scratch (genomes gain new senses and outputs as they appear).
#   0-99 food | 100-199 + hazards | 200-299 + farmable terrain (act neuron) |
#   300-449 + spicy seasons (= terrain_50_spicy) | 450-499 shock: harsh winter, half the food
experiment: curriculum_50_plastic
seed: 42
world:
  width: 50
  height: 50
  steps_per_episode: 1000
stimuli:
- type: food
  count: 95
  regrow_rate: 0.01
network:
  plasticity:
    enabled: true
  encoder: rate
  hidden_max: 30
  dt_ms: 1.0
  neuron:
    tau_m: 20.0
    v_thresh: 1.0
    v_reset: 0.0
    refractory_ms: 2.0
genetics:
  population: 200
  generations: 500
  tournament_size: 3
  elitism: 5
  mutation:
    weight: 0.1
    threshold: 0.05
    add_synapse: 0.02
    remove_synapse: 0.01
fitness:
  energy: 1.0
  firing_penalty:
    target_rate_hz: 20
    weight: 0.5
  silence_penalty:
    weight: 0.5
  exploration:
    weight: 0.0
phases:
- from_generation: 100
  name: hazards
  set:
    stimuli:
    - &id001
      type: food
      count: 95
      regrow_rate: 0.01
    - &id002
      type: hazard
      count: 8
      radius: 2.5
      damage:
      - 1.0
      - 3.0
      - 6.0
- from_generation: 200
  name: farming
  set:
    network:
      action_outputs: 1
      action_threshold_hz: 50.0
    stimuli:
    - *id001
    - *id002
    - &id003
      type: terrain
      action: 0
      fertile_zones: 20
      fertile_radius: 5.0
      crops:
      - name: slow
        grow_time: 30
        energy: 15.0
        weight: 3
      - name: medium
        grow_time: 15
        energy: 7.0
        weight: 3
      - name: fast
        grow_time: 5
        energy: 2.0
        weight: 3
      - name: jackpot
        grow_time: 5
        energy: 60.0
        weight: 0.5
      poison_damage: 2.0
      poison_duration: 200
      action_cost: 0.05
- from_generation: 300
  name: spicy_seasons
  set:
    agent:
      metabolic_cost: 0.08
    stimuli:
    - type: season
      random_phase: true
      channels:
      - phase_sin
      - phase_cos
      seasons:
      - name: spring
        length: 125
        modifiers:
          food.regrow_rate: 2.0
          terrain.growth_rate: 1.5
      - name: summer
        length: 125
        living_cost: 0.05
        modifiers:
          hazard.damage: 2.0
      - name: autumn
        length: 125
        modifiers:
          terrain.harvest_energy: 1.5
      - name: winter
        length: 125
        living_cost: 0.15
        modifiers:
          food.regrow_rate: 0.0
          terrain.growth_rate: 0.2
          hazard.damage: 0.5
          terrain.action_cost: 2.0
    - *id001
    - *id002
    - *id003
- from_generation: 450
  name: shock
  set:
    stimuli:
    - type: season
      random_phase: true
      channels:
      - phase_sin
      - phase_cos
      seasons:
      - name: spring
        length: 125
        modifiers:
          food.regrow_rate: 2.0
          terrain.growth_rate: 1.5
      - name: summer
        length: 125
        living_cost: 0.05
        modifiers:
          hazard.damage: 2.0
      - name: autumn
        length: 125
        modifiers:
          terrain.harvest_energy: 1.5
      - name: winter
        length: 125
        living_cost: 0.35
        modifiers:
          food.regrow_rate: 0.0
          terrain.growth_rate: 0.2
          hazard.damage: 0.5
          terrain.action_cost: 2.0
    - type: food
      count: 48
      regrow_rate: 0.01
    - *id002
    - *id003
