# Food + hazards of different strength + terrain the agents can modify (50x50).
# The agents get one extra "act" output neuron. Acting on hidden fertile soil plants a crop
# (ripe after grow_time, worth 3 food items); acting on barren soil poisons the cell.
experiment: terrain_50
seed: 42
world:
  width: 50
  height: 50
  steps_per_episode: 1000
stimuli:
  - type: food
    count: 95
    regrow_rate: 0.01
  - type: hazard
    count: 8
    radius: 2.5
    damage: [1.0, 3.0, 6.0]   # each zone gets one level; sensed in proportion
  - type: terrain
    action: 0
    fertile_zones: 10         # ~20% of the grid is fertile (invisible to the agents)
    fertile_radius: 4.0
    grow_time: 100
    harvest_energy: 15.0
    poison_damage: 2.0
    poison_duration: 200
    action_cost: 0.2
network:
  encoder: rate
  hidden_max: 30
  dt_ms: 1.0
  action_outputs: 1
  action_threshold_hz: 50.0
  neuron: { tau_m: 20.0, v_thresh: 1.0, v_reset: 0.0, refractory_ms: 2.0 }
genetics:
  population: 200
  generations: 300
  tournament_size: 3
  elitism: 5
  mutation: { weight: 0.1, threshold: 0.05, add_synapse: 0.02, remove_synapse: 0.01 }
fitness:
  energy: 1.0
  firing_penalty: { target_rate_hz: 20, weight: 0.5 }
  silence_penalty: { weight: 0.5 }
  exploration: { weight: 0.0 }
