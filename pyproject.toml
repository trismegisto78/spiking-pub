[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spiking-evo"
version = "0.1.0"
description = "Evolutionary environment for spiking neural network agents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
analysis = ["matplotlib>=3.8"]  # plots of `spiking-evo analyze` only

[project.scripts]
spiking-evo = "spiking_evo.cli:main"

[tool.setuptools.packages.find]
include = ["spiking_evo*"]

[tool.setuptools.package-data]
spiking_evo = ["experiments/*.yaml", "experiments/*.toml"]

[tool.pytest.ini_options]
testpaths = ["spiking_evo/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
